name: haft-build

# Builds haft wheel+sdist from a CLEAN checkout of origin/main and publishes to
# the private index. Runtime publish (not a Docker build) so the RW token comes
# in as env, never baked into a layer. Working tree is mounted read-only; only
# origin/main is archived, so published == pushed (versioning via pyproject.toml).
#
# Invoke from the repo root:
#   docker compose -f build/docker-compose.yml --env-file <path/to/rw.env> run --rm build
#
# The env file must provide TWINE_USERNAME and TWINE_PASSWORD (the RW devpi
# token), and REPO_ROOT. For LOCAL publishing over the SSH tunnel, also set
# TWINE_REPOSITORY_URL=http://host.docker.internal:7974/bracket/packages/
# (defaults to the public hostname when unset).

services:
  build:
    image: ghcr.io/bracket/base-build-python:3.13.14
    working_dir: /work
    environment:
      TWINE_REPOSITORY_URL: '${TWINE_REPOSITORY_URL:-https://pypi.bracketzone.com/bracket/packages/}'
      TWINE_USERNAME: '${TWINE_USERNAME:?Error: TWINE_USERNAME must be set via --env-file}'
      TWINE_PASSWORD: '${TWINE_PASSWORD:?Error: TWINE_PASSWORD must be set via --env-file}'
    # Lets the container reach the SSH-forwarded devpi listening on the Mac host
    # (host.docker.internal → host-gateway). Harmless when using the public URL.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: '${REPO_ROOT:?Error: REPO_ROOT must be set via --env-file}'
        target: /repo
        read_only: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /work
        git -C /repo archive --format=tar origin/main | tar -x -C /work
        /opt/python/bin/python3 -m pip install --no-cache-dir build twine
        /opt/python/bin/python3 -m build --outdir /work/dist /work
        /opt/python/bin/python3 -m twine upload --non-interactive /work/dist/*
